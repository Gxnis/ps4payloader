<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Payload Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 PS4 Payload Loader</h1>
            <p>Lancez vos payloads PS4 (.bin) directement depuis ce site</p>
        </header>

        <div class="payloads-section">
            <h2>Payloads Disponibles</h2>
            <div id="payloadsList" class="payloads-list">
                <!-- Les payloads seront chargés ici -->
            </div>
        </div>

        <div class="info-section">
            <h2>Instructions</h2>
            <p>Ce site permet de lancer des payloads directement depuis votre PS4. Sélectionnez un payload ci-dessous pour l'exécuter.</p>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
</body>
</html>
